name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # verify:dataset-file-metadata derives timestamps from git history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fast aggregate gate: syntax sweep, unit tests, pending guard, SSOT
      # parity, i18n coverage, metadata freshness (no rendering).
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      # Headless boot + interaction smoke of the modular viewer.
      - run: pnpm verify:app
      # Build the Pages projection and enforce its request/lazy-loading budgets.
      - run: pnpm build:site
      - run: pnpm verify:site
      # One d3 render as a pipeline smoke: hard gates + pixel metrics.
      - run: pnpm verify:d3 -- salesforce-q1-fy27
      # Batch-render every registered dataset through the purity/size hard
      # gates. Reference images are local-only, so CI cannot score pixel
      # similarity; the similarity baseline gate runs on machines that hold
      # input/processed/ (see data/render-baselines.json).
      - run: pnpm verify:render-regression
      # The standalone artifact must build and stay self-contained.
      - run: pnpm build:standalone
      - run: pnpm verify:standalone
