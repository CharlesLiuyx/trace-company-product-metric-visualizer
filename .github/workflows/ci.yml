name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A newer push replaces an unfinished check. Its ChangeImpact base is the
    # last successful ancestor, so the replaced commit stays inside its scope.
    concurrency:
      group: ci-check-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      site_projection: ${{ steps.plan.outputs.site_projection }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          # Dataset timestamps and the ChangeImpact planner both need history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Plan checks from ChangeImpact
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            pnpm plan:ci -- --head "$HEAD_SHA" --last-successful-main --github-output "$GITHUB_OUTPUT"
          else
            pnpm plan:ci -- --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.plan.outputs.reviewed_transport != 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install icon crop dependencies
        if: steps.plan.outputs.reviewed_transport != 'true'
        run: python -m pip install -r scripts/requirements.txt

      # The deterministic gate owns syntax, unit tests, pending collisions,
      # architecture/app-global contracts, generated projections, SSOT/i18n
      # parity, render-baseline structure, and metadata freshness. Operator
      # policy: human-reviewed Dataset transports ship without it and fix forward.
      - name: Fast deterministic checks
        if: steps.plan.outputs.reviewed_transport != 'true'
        run: pnpm check

      - name: Restore Chromium downloads
        id: chromium-cache
        if: >-
          steps.plan.outputs.needs_browser == 'true' ||
          (github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          steps.plan.outputs.site_projection == 'true' && steps.plan.outputs.reviewed_transport != 'true')
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: chromium-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Keep OS libraries calibrated even on a browser-download cache hit.
      - name: Install Chromium and OS dependencies
        if: >-
          steps.plan.outputs.needs_browser == 'true' ||
          (github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          steps.plan.outputs.site_projection == 'true' && steps.plan.outputs.reviewed_transport != 'true')
        run: pnpm exec playwright install --with-deps chromium

      # Standalone only reads the checkout and opens its own file:// page, so
      # it overlaps the browser checks below; its verdict is collected after them.
      - name: Start standalone build and verification
        if: steps.plan.outputs.build_standalone == 'true'
        env:
          VERIFY_STANDALONE: ${{ steps.plan.outputs.verify_standalone }}
        run: |
          (
            result=0
            pnpm build:standalone || result=$?
            if [ "$result" = 0 ] && [ "$VERIFY_STANDALONE" = true ]; then pnpm verify:standalone || result=$?; fi
            echo "$result" > "$RUNNER_TEMP/standalone.status"
          ) > "$RUNNER_TEMP/standalone.log" 2>&1 &

      - name: Verify viewer interactions
        if: steps.plan.outputs.verify_app == 'true'
        run: pnpm verify:app

      - name: Verify concurrent local review workbench
        if: steps.plan.outputs.verify_app == 'true'
        run: pnpm verify:workbench

      # Best-effort retention for already-open tabs. Only trusted main runs
      # save this cache; a cache miss still builds a complete current release.
      - name: Restore previous Pages runtimes
        if: steps.plan.outputs.build_site == 'true'
        uses: actions/cache/restore@v5
        with:
          path: output/site-releases
          key: pages-runtimes-v1-${{ github.sha }}
          restore-keys: pages-runtimes-v1-

      - name: Build Pages projection
        if: steps.plan.outputs.build_site == 'true'
        run: pnpm build:site

      - name: Verify release bytes and reviewed transport mapping
        if: steps.plan.outputs.build_site == 'true'
        run: pnpm verify:release

      - name: Verify Pages loading and interaction budgets
        if: >-
          steps.plan.outputs.verify_site == 'true' ||
          (github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          steps.plan.outputs.site_projection == 'true' && steps.plan.outputs.reviewed_transport != 'true')
        run: pnpm verify:site

      # Processed reference images are machine-local. CI render regression
      # always runs hard gates and adds similarity only when a local reference
      # happens to be available.
      - name: Verify all registered renders
        if: steps.plan.outputs.render_scope == 'full'
        run: pnpm verify:render-regression

      - name: Verify changed Dataset Adapter renders
        if: steps.plan.outputs.render_scope == 'changed'
        run: pnpm verify:render-regression -- ${{ steps.plan.outputs.render_keys }}

      - name: Collect standalone verification
        if: steps.plan.outputs.build_standalone == 'true'
        run: |
          timeout 300 bash -c 'until [ -f "$RUNNER_TEMP/standalone.status" ]; do sleep 1; done' || echo 124 > "$RUNNER_TEMP/standalone.status"
          cat "$RUNNER_TEMP/standalone.log"
          exit "$(cat "$RUNNER_TEMP/standalone.status")"

      # The exact Pages artifact verified above is the one deployed below;
      # the old second checkout/install/build workflow was intentionally removed.
      - name: Upload verified Pages artifact
        if: >-
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          steps.plan.outputs.site_projection == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Retain verified Pages runtimes
        if: >-
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          steps.plan.outputs.site_projection == 'true'
        uses: actions/cache/save@v5
        with:
          path: output/site-releases
          key: pages-runtimes-v1-${{ github.sha }}

      - name: Retain Chromium downloads
        if: >-
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          steps.chromium-cache.outcome == 'success' && steps.chromium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.chromium-cache.outputs.cache-primary-key }}

  deploy:
    name: Deploy Pages
    needs: check
    if: >-
      needs.check.result == 'success' && needs.check.outputs.site_projection == 'true' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deploys queue here, not in the check job; a newer check starts at once.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v5
